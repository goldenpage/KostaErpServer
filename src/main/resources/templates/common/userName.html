<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Insert title here</title>
  <link rel="stylesheet" th:href="@{/css/userName.css}">
</head>
<body>

<ul class="profile" th:fragment="userName">
  <li><span id="user"></span></li>
  <li th:onclick="|location.href='@{/logout}'|">로그아웃</li>
  <li th:onclick="|location.href='@{/notice}'|">알림</li>

  <li class="stock-notice-wrapper" id="stockNoticeWrapper">
    <span class="stock-notice-trigger" onclick="stockNoticeToggle()">
      재고/유통기한 알림
      <span class="stock-badge hidden" id="stockBadge">0</span>
    </span>

    <div class="stock-dropdown hidden" id="stockDropdown">
      <div class="stock-dropdown-header">
        <span>식자재 알림</span>
        <button class="stock-read-all-btn" onclick="stockMarkAllAsRead()">전체 확인</button>
      </div>
      <ul class="stock-list" id="stockList">
        <li class="stock-empty">불러오는 중...</li>
      </ul>
    </div>
  </li>
  <script th:src="@{/js/userName.js}"></script>
</ul>

</body>
</html>
