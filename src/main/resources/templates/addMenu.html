<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메뉴 입력</title>
  <link rel="stylesheet" th:href="@{/css/addMenu.css}">
</head>
<body>
<div class="container">
  <section>
    <th:block th:replace="~{common/sideMenu}"></th:block>
  </section>

  <div class="main">
    <div>
      <th:block th:replace="~{common/userName}"></th:block>
    </div>
    <h1>메뉴 입력</h1>

    <div th:if="${not #strings.isEmpty(errorMessage)}" style="color:red; margin: 0 10px;" th:text="${errorMessage}"></div>
    <div th:if="${not #strings.isEmpty(successMessage)}" style="color:green; margin: 0 10px;" th:text="${successMessage}"></div>

    <div class="content_item">
      <div class="content_left">

        <div class="input_section">
          <div class="input_row">
            <div class="category_buttons">
              <label>메뉴 카테고리 추가</label>
              <input type="text" id="getMenuCategory" placeholder="카테고리 입력">
              <button type="button" onclick="addCategoryAjax()">추가</button>
            </div>
          </div>

          <div class="input_row">
            <div class="category_buttons" id="categoryArea">
              <th:block th:each="category : ${categoryList}">
                <span style="display:inline-flex; align-items:center; gap:2px;">
                  <button type="button" onclick="selectCategory(this)"
                          th:data-category-id="${category.menuCategoryId}"
                          th:text="${category.menuCategory}"></button>
                  <button type="button" class="remove_btn"
                          th:data-category-name="${category.menuCategory}"
                          onclick="deleteCategoryAjax(this.dataset.categoryName, this)">&#10005;</button>
                </span>
              </th:block>
            </div>
          </div>
          <div id="categoryMsg" style="font-size:13px; margin-bottom:8px;"></div>
        </div>
          <input type="hidden" id="selectedCategoryId" name="_dummy" value="">

          <div class="input_section">
            <div class="input_row">
              <label>메뉴명 입력 *</label>
              <input type="text" id="inputMenuName" placeholder="치즈김밥">
            </div>

            <div class="input_fields">
              <label>메뉴 가격 *</label>
              <input type="number" id="inputMenuPrice" placeholder="4000" min="0"> 원
            </div>
          </div>

          <div class="ingredient_section">
            <h3>사용 식자재 추가 *</h3>

            <div class="ingredient_add_row">
              <label>식자재</label>
              <select id="inputIngredientSelect">
                <option value="">-- 선택 --</option>
              </select>
              <label>수량</label>
              <input type="number" id="inputIngredientAmount" placeholder="50" min="1">
              <span>g</span>
              <button type="button" onclick="addIngredient()">+ 추가하기</button>
            </div>

            <div class="ingredient_table">
              <table id="ingredientTable">
                <thead>
                <tr>
                  <th>이름</th>
                  <th>수량(g)</th>
                  <th>삭제</th>
                </tr>
                </thead>
                <tbody id="ingredientBody">
                <tr>
                  <td colspan="3" class="empty_msg">추가된 식자재가 없습니다</td>
                </tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="register_btn">
            <button type="button" onclick="addMenuToList()">추가</button>
          </div>

          <div id="hiddenFields"></div>

      </div>

      <div class="content_right">
        <h3>등록할 메뉴 목록</h3>

        <div class="right_top">
          <table id="registerMenuTable" style="width:100%">
            <thead>
            <tr>
              <th>메뉴명</th>
              <th>카테고리</th>
              <th>가격</th>
              <th>삭제</th>
            </tr>
            </thead>
            <tbody id="registerMenuBody">
            <tr>
              <td colspan="4" class="empty_msg">추가된 메뉴가 없습니다</td>
            </tr>
            </tbody>
          </table>
        </div>
        <div class="right_bottom">
          <div class="register_final_btn">
            <button type="button" onclick="registerAllMenus()">메뉴 등록</button>
          </div>
          <h4>&#9660; 사용 식자재 (<span id="selectedMenuName">메뉴를 선택하세요</span>)</h4>
          <table class="ingredient_detail_table">
            <thead>
            <tr>
              <th>이름</th>
              <th>수량(g)</th>
            </tr>
            </thead>
            <tbody id="ingredientDetailBody">
            <tr>
              <td colspan="2" class="empty_msg">-</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/addMenu.js}"></script>
</body>
</html>
