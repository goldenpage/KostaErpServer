<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>식자재 조회</title>
    <link rel="stylesheet" th:href="@{/css/foodMaterials.css}">
</head>

<body>
<div class="container">

    <div class="sideMenu">
        사이드 메뉴 영역
    </div>

    <div class="main">

        <ul class="profile">
            <li>사용자님</li>
            <li>로그아웃</li>
            <li>알림</li>
            <li onclick="history.back()">뒤로가기</li>
        </ul>

        <h1>식자재 확인</h1>

        <div class="content_item">

            <ul class="category">
                <li>
                    <input type="text" id="searchKeyword" placeholder="검색">
                    <button type="button" id="searchBtn">검색하기</button>
                </li>

                <li>
                    <select id="categorySelect">
                        <option value="">전체</option>
                        <option value="채소">채소</option>
                        <option value="정육">정육</option>
                        <option value="유제품">유제품</option>
                        <option value="가공식품">가공식품</option>
                        <option value="음료/주류">음료/주류</option>
                        <option value="양념">양념</option>
                        <option value="곡류">곡류</option>
                        <option value="해산물">해산물</option>
                    </select>
                </li>
            </ul>

            <table class="list_container">
                <thead>
                <tr class="list_item">
                    <th>
                        <button type="button" onclick="loadFoodMaterials('idAsc', 1)">번호 ▲</button>
                        <button type="button" onclick="loadFoodMaterials('idDesc', 1)">번호 ▼</button>
                    </th>
                    <th>식자재명</th>
                    <th>카테고리</th>
                    <th>전체수량</th>
                    <th>전체용량</th>
                    <th>매입가격</th>
                    <th>구입처</th>
                    <th>매입날짜</th>
                    <th>
                        <button type="button" onclick="loadFoodMaterials('expAsc', 1)">유통기한 ▲</button>
                        <button type="button" onclick="loadFoodMaterials('expDesc', 1)">유통기한 ▼</button>
                    </th>
                    <th>품목유형</th>
                    <th>폐기수정</th>
                    <th>
                        <button type="button" id="selectAllBtn">전체선택</button>
                    </th>
                    <th>삭제</th>
                </tr>
                </thead>

                <tbody id="foodTableBody">
                <tr class="foodRow" th:each="food : ${foodList}">
                    <td th:text="${food.foodMaterialId}">FM001</td>
                    <td th:text="${food.foodMaterialName}">식자재명</td>
                    <td th:text="${food.foodCategory}">카테고리</td>
                    <td th:text="${food.foodMaterialCount}">전체수량</td>
                    <td th:text="${food.foodMaterialCountAll}">전체용량</td>
                    <td th:text="${food.foodMaterialPrice}">매입가격</td>
                    <td th:text="${food.vender}">구입처</td>
                    <td th:text="${food.incomeDate}">매입날짜</td>
                    <td th:text="${food.expirationDate}">유통기한</td>
                    <td th:text="${food.foodMaterialType}">품목유형</td>
                    <td>폐기수정</td>
                    <td>
                        <input type="checkbox"
                               name="foodMaterialId"
                               th:value="${food.foodMaterialId}">
                    </td>
                    <td>
                        <button type="button"
                                th:onclick="|deleteFoodMaterial('${food.foodMaterialId}')|">
                            삭제
                        </button>
                    </td>
                </tr>

                <tr class="emptyRow" th:if="${#lists.isEmpty(foodList)}">
                    <td colspan="13">조회된 식자재가 없습니다.</td>
                </tr>
                </tbody>
            </table>

            <ul class="page">
                <li th:if="${currentPage > 1}">
                    <button type="button"
                            th:onclick="|loadFoodMaterials('${sort}', ${currentPage - 1})|">
                        &lt;
                    </button>
                </li>

                <li th:each="i : ${#numbers.sequence(1, totalPage)}">
                    <button type="button"
                            th:onclick="|loadFoodMaterials('${sort}', ${i})|"
                            th:text="${i}">
                        1
                    </button>
                </li>

                <li th:if="${currentPage < totalPage}">
                    <button type="button"
                            th:onclick="|loadFoodMaterials('${sort}', ${currentPage + 1})|">
                        &gt;
                    </button>
                </li>
            </ul>

        </div>
    </div>
</div>

<script th:inline="javascript">
    var bId = /*[[${bId}]]*/ "0000000000";
    var currentSort = /*[[${sort}]]*/ "idDesc";
    var pageSize = /*[[${size}]]*/ 5;
</script>
<script th:src="@{/js/foodMaterials.js}"></script>
</body>
</html>
