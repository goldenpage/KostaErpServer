<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>판매 기록 확인</title>
    <link rel="stylesheet" th:href="@{/css/sideMenu.css}">
    <link rel="stylesheet" th:href="@{/css/userName.css}">
    <link rel="stylesheet" th:href="@{/css/salesList.css}">
</head>
<body>
<div class="container">
    <div th:replace="~{common/sideMenu :: sideMenu}"></div>

    <div class="main">
        <div th:replace="~{common/userName :: userName}"></div>

        <h2>판매 기록 조회</h2>

        <div class="search-filter-box">
            <input type="date" id="startDate"> ~ <input type="date" id="endDate">
            <select id="categorySelect" onchange="filterSales()"><option value="">카테고리</option></select>
            <select id="paymentSelect" onchange="filterSales()"><option value="">결제수단</option></select>
            <select id="menuSelect" onchange="filterSales()"><option value="">메뉴명</option></select>
            <button class="btn-primary" onclick="searchSales()">조회하기</button>
            <button class="btn-secondary" onclick="resetFilters()">초기화</button>
        </div>

        <div class="summary-box">
            조회 기간 총 매출: <span id="totalRevenue" th:text="${#numbers.formatInteger(totalSum, 3, 'COMMA') + '원'}">0원</span>
        </div>

        <table class="list_container">
            <thead>
            <tr>
                <th>번호</th><th>판매날짜</th><th>메뉴명</th><th>카테고리</th>
                <th>수량</th><th>금액</th><th>합계</th><th>결제수단</th><th>관리</th>
            </tr>
            </thead>
            <tbody id="salesTableBody">
            <tr th:if="${#lists.isEmpty(salesList)}">
                <td colspan="8" style="text-align:center; padding:20px;">조회된 데이터가 없습니다.</td>
            </tr>
            <tr th:each="sale : ${salesList}">
                <td th:text="${sale.saleId}"></td>
                <td th:text="${sale.saleDate}"></td>
                <td th:text="${sale.menuName}"></td>
                <td th:text="${sale.category}"></td>
                <td th:text="${sale.qty}"></td>
                <td th:text="${#numbers.formatInteger(sale.price, 3, 'COMMA')}"></td>
                <td th:text="${#numbers.formatInteger(sale.qty * sale.price, 3, 'COMMA')}"></td>
                <td th:text="${sale.paymentMethod}"></td>
                <td>
                    <button type="button" class="btn-edit" th:data-id="${sale.saleId}">수정</button>
                    <button type="button" class="btn-delete" th:data-id="${sale.saleId}">삭제</button>
                </td>
            </tr>
            </tbody>
        </table>
        <div id="editModal" style="display:none; position:fixed; top:20%; left:30%; background:white; padding:20px; border:1px solid #ccc;">
            <h3>판매 기록 수정</h3>
            <input type="hidden" id="editSaleId">
            메뉴명: <input type="text" id="editMenuName" readonly><br>
            수량: <input type="number" id="editQty"><br>
            결제수단: <input type="text" id="editPayment"><br>
            <button onclick="saveEdit()">저장</button>
            <button onclick="closeModal()">취소</button>
        </div>
    </div>
</div>
<script th:inline="javascript">
    /*<![CDATA[*/
    window.onload = function() {
        // 서버에서 전달받은 salesList를 자바스크립트 변수로 안전하게 가져옴
        const initialData = /*[[${salesList}]]*/ [];
        console.log("전달받은 데이터:", initialData);

        if (initialData && initialData.length > 0) {
            updateTableAndTotal(initialData);
        } else {
            console.log("데이터가 없습니다.");
        }
    };
    /*]]>*/
</script>
<script th:src="@{/js/salesList.js}"></script>
</body>
</html>
