server:
  port: 15000

spring:
  application:
    name: KostaErpServer
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    check-template-location: true
  jpa:
    open-in-view: false
    generate-ddl: true
    show-sql: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        show_sql: true
        format_sql: true
        globally_quoted_identifiers: true

kind: Application
logging:
  level:
    com.oopsw: info

mybatis:
  #  type-aliases-package: com.oopsw.aspringweb.dao
  type-aliases-package: com.oopsw.kostaerpserver.vo
  mapper-locations: classpath:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true