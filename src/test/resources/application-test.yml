server:
  port: 15000

spring:
  application:
    name: KostaErpServer
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: true
    hibernate:
      ddl-auto: ${TEST_DB_DDL_AUTO:update}
    properties:
      hibernate:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        show_sql: true
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

kind: Application
logging:
  level:
    com.oopsw: info

mybatis:
  #  type-aliases-package: com.oopsw.aspringweb.dao
  type-aliases-package: com.oopsw.kostaerpserver.vo
  mapper-locations: classpath:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

external-api:
  python-ocr-url: http://127.0.0.1:8000/api/v1/business-document-ocr
  business-registration-url: http://127.0.0.1:3000/nts-businessman/v1/validate